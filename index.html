<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

  <!-- iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biz">
  <meta name="theme-color" content="#05060A">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" as="image" href="assets/celebration-love-show.png">

  <title>Biz</title>

  <style>
    :root{
      --bg0:#05060A;
      --bg1:#0A0B12;
      --app-viewport-height:100dvh;
      --celebration-lock-height:100dvh;
      --celebration-lock-top:0px;
      --celebration-viewport-bleed:96px;

      --card:rgba(255,255,255,.055);
      --stroke:rgba(255,255,255,.10);

      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);

      --accent:#FF2D55; /* iOS rose */
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      min-height:100%;
      background:#05060A;
      overflow-x:hidden;
    }

    html.celebration-lock{
      height:calc(var(--celebration-lock-height) + var(--celebration-viewport-bleed));
      overflow:hidden !important;
      overscroll-behavior:none;
      touch-action:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.18)),
        url("./assets/celebration-love-show.png") center center / cover no-repeat,
        linear-gradient(180deg, #8b0041 0%, #35001f 55%, #13000d 100%) !important;
    }

    body.celebration-lock{
      position:fixed !important;
      top:var(--celebration-lock-top) !important;
      left:0 !important;
      right:0 !important;
      bottom:calc(-1 * var(--celebration-viewport-bleed)) !important;
      width:100% !important;
      height:calc(var(--celebration-lock-height) + var(--celebration-viewport-bleed)) !important;
      min-height:calc(100dvh + var(--celebration-viewport-bleed)) !important;
      overflow:hidden !important;
      overscroll-behavior:none;
      touch-action:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.18)),
        url("./assets/celebration-love-show.png") center center / cover no-repeat,
        linear-gradient(180deg, #8b0041 0%, #35001f 55%, #13000d 100%) !important;
    }

    body{
      min-height:100vh;
      min-height:var(--app-viewport-height);
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui;
      color:var(--text);
      background:
        radial-gradient(800px 600px at 50% -10%, rgba(255,45,85,.15), transparent 60%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
    }

    body.appBooting{
      background:
        radial-gradient(820px 620px at 50% 18%, rgba(255,45,135,.46), transparent 66%),
        radial-gradient(520px 420px at 20% 82%, rgba(255,210,96,.22), transparent 68%),
        linear-gradient(180deg, #6b0034 0%, #2d001b 46%, #09040a 100%);
    }

    body.appBooting::before{
      content:"";
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:calc(-1 * var(--celebration-viewport-bleed));
      height:calc(100dvh + var(--celebration-viewport-bleed));
      z-index:9998;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.22)),
        url("./assets/celebration-love-show.png") center center / cover no-repeat,
        radial-gradient(820px 620px at 50% 18%, rgba(255,45,135,.50), transparent 66%),
        linear-gradient(180deg, #8b0041 0%, #35001f 55%, #13000d 100%);
      transform:translate3d(0,0,0) scale(1.01);
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      opacity:1;
      transition:opacity .16s ease;
    }

    body.appBooting.bootCurtainOut::before{
      opacity:0;
    }

    body.appBooting .safe{
      opacity:0;
      visibility:hidden;
    }

    .safe{
      min-height:100vh;
      min-height:var(--app-viewport-height);
      padding:calc(20px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:560px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .card{
      border-radius:26px;
      padding:18px;
      background:var(--card);
      border:1px solid var(--stroke);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:0 25px 80px rgba(0,0,0,.55);
    }

    .sectionTitle{
      font-size:12px;
      letter-spacing:1.2px;
      font-weight:900;
      color:var(--muted);
      margin-bottom:12px;
      text-align:center;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .item{
      border-radius:22px;
      padding:16px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.08);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .itemTop{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      text-align:center;
    }

    .itemName{
      font-weight:950;
      font-size:16px;
      letter-spacing:.2px;
    }

    .itemDate{
      font-size:12px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }

    .centerHeart{
      display:flex;
      justify-content:center;
      padding:12px 0 6px;
    }

    .heart{
      width:44px;
      height:44px;
      transform-origin:center;
      animation: heartbeat 1.18s infinite;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.55))
              drop-shadow(0 0 14px rgba(255,45,85,.18));
    }

    @keyframes heartbeat{
      0%   { transform: scale(1); }
      12%  { transform: scale(1.26); }
      24%  { transform: scale(1); }
      42%  { transform: scale(1.14); }
      56%  { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .big{
      font-size:19px;
      font-weight:950;
      text-align:center;
      font-variant-numeric:tabular-nums;
      letter-spacing:.2px;
    }

    .pill{
      padding:9px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      font-size:12px;
      text-align:center;
      font-variant-numeric:tabular-nums;
      color:rgba(255,255,255,.78);
      line-height:1.35;
      white-space:normal;
      word-break:break-word;
    }

    /* MUSIC */
.musicControl{
  display:flex;
  justify-content:center;
  margin-bottom:4px;
}

    .musicBtn{
      padding:10px 18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.85);
      font-weight:800;
      font-size:13px;
      letter-spacing:.3px;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 10px 35px rgba(0,0,0,.55);
      cursor:pointer;
      transition:.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    .musicBtn:active{ transform:scale(.97); }

    .musicBtn.playing{
      background:rgba(255,45,85,.14);
      border-color:rgba(255,45,85,.32);
    }

    .footer{
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.45);
      padding-top:6px;
    }
    .footer strong{color:rgba(255,255,255,.75)}


    /* ANNIVERSARY CELEBRATION OVERLAY */
    .celebrationOverlay{
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:calc(-1 * var(--celebration-viewport-bleed));
      width:100%;
      height:calc(var(--celebration-lock-height) + var(--celebration-viewport-bleed));
      min-height:calc(100dvh + var(--celebration-viewport-bleed));
      z-index:9999;
      overflow:hidden;
      overscroll-behavior:none;
      -webkit-overflow-scrolling:auto;
      touch-action:none;
      isolation:isolate;
      contain:layout paint size;
      background:
        radial-gradient(680px 520px at 50% 12%, rgba(255,45,85,.34), transparent 68%),
        linear-gradient(180deg, #150011 0%, #09040a 100%);
      opacity:1;
      pointer-events:auto;
      transform:translate3d(0,0,0);
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .celebrationArtwork{
      position:absolute;
      top:0;
      left:0;
      right:0;
      bottom:calc(-1 * var(--celebration-viewport-bleed));
      z-index:0;
      width:100%;
      height:calc(100% + var(--celebration-viewport-bleed));
      min-height:calc(100dvh + var(--celebration-viewport-bleed));
      object-fit:cover;
      object-position:center center;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
      transform:translate3d(0,0,0) scale(1.012);
      filter:saturate(1.08) contrast(1.04) brightness(.96);
      animation:celebrationArtworkIdle 14s ease-in-out infinite;
    }

    .celebrationOverlay::before{
      content:"";
      position:absolute;
      inset:-18%;
      z-index:1;
      pointer-events:none;
      background:
        conic-gradient(from 0deg at 50% 48%, transparent 0 12%, rgba(255,214,112,.24) 15%, transparent 21%, rgba(255,45,135,.22) 32%, transparent 41%, rgba(255,255,255,.16) 52%, transparent 61%, rgba(255,179,71,.22) 72%, transparent 86%);
      mix-blend-mode:screen;
      opacity:.42;
      filter:blur(8px) saturate(1.2);
      animation:celebrationVortex 18s linear infinite;
    }

    .celebrationOverlay::after{
      content:"";
      position:absolute;
      inset:0 0 calc(-1 * var(--celebration-viewport-bleed)) 0;
      z-index:2;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.10) 48%, rgba(0,0,0,.50) 100%),
        radial-gradient(420px 210px at 50% 88%, rgba(0,0,0,.60), transparent 72%),
        radial-gradient(460px 460px at 50% 34%, transparent 40%, rgba(0,0,0,.08) 100%);
    }

    .celebrationLightLayer{
      position:absolute;
      inset:0 0 calc(-1 * var(--celebration-viewport-bleed)) 0;
      z-index:2;
      pointer-events:none;
      overflow:hidden;
    }

    .celebrationLightLayer::before,
    .celebrationLightLayer::after{
      content:"";
      position:absolute;
      left:50%;
      top:46%;
      width:92vmax;
      height:92vmax;
      border-radius:50%;
      border:2px solid rgba(255,222,128,.28);
      box-shadow:
        0 0 28px rgba(255,215,118,.40),
        inset 0 0 28px rgba(255,45,85,.20);
      transform:translate(-50%, -50%) rotate(0deg) scale(.70);
      opacity:.42;
      animation:celebrationOrbit 9s linear infinite;
    }

    .celebrationLightLayer::after{
      width:70vmax;
      height:70vmax;
      border-color:rgba(255,45,135,.26);
      animation-duration:6.5s;
      animation-direction:reverse;
      opacity:.34;
    }

    .celebrationCard{
      position:absolute;
      left:max(14px, env(safe-area-inset-left));
      right:max(14px, env(safe-area-inset-right));
      bottom:calc(16px + env(safe-area-inset-bottom));
      z-index:4;
      width:auto;
      max-width:520px;
      margin:0 auto;
      padding:14px 14px 12px;
      border-radius:26px;
      color:rgba(255,255,255,.94);
      text-align:center;
      background:
        linear-gradient(180deg, rgba(38,0,22,.58), rgba(12,0,9,.74)),
        rgba(12,0,9,.70);
      border:1px solid rgba(255,221,142,.34);
      box-shadow:
        0 22px 70px rgba(0,0,0,.66),
        0 0 46px rgba(255,45,85,.20),
        inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter:blur(18px) saturate(1.28);
      -webkit-backdrop-filter:blur(18px) saturate(1.28);
      transform:translate3d(0,0,0);
    }

    .celebrationEyebrow{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:24px;
      padding:5px 12px;
      border-radius:999px;
      margin-bottom:8px;
      font-size:11px;
      font-weight:950;
      letter-spacing:1.1px;
      text-transform:uppercase;
      color:#FFE7A6;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,231,166,.24);
      text-shadow:0 0 12px rgba(255,205,92,.38);
    }

    .celebrationTitle{
      font-size:clamp(18px, 5.2vw, 24px);
      line-height:1.12;
      font-weight:950;
      letter-spacing:.15px;
      color:#fff;
      text-shadow:
        0 2px 14px rgba(0,0,0,.62),
        0 0 22px rgba(255,45,85,.42);
    }

    .celebrationText{
      margin:7px auto 0;
      max-width:36em;
      font-size:13.5px;
      line-height:1.36;
      color:rgba(255,255,255,.84);
    }

    .celebrationMeta{
      display:inline-flex;
      justify-content:center;
      margin-top:9px;
      padding:7px 10px;
      border-radius:999px;
      font-size:11.5px;
      font-weight:750;
      color:rgba(255,240,205,.86);
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      font-variant-numeric:tabular-nums;
    }

    .celebrationEvents{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:10px;
    }

    .celebrationEventMini{
      padding:7px 9px;
      border-radius:14px;
      font-size:12px;
      font-weight:800;
      color:rgba(255,255,255,.86);
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
    }

    .celebrationDismiss{
      position:absolute;
      top:calc(12px + env(safe-area-inset-top));
      right:calc(12px + env(safe-area-inset-right));
      z-index:5;
      width:42px;
      height:42px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.20);
      background:rgba(0,0,0,.36);
      color:#fff;
      font-size:25px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 12px 38px rgba(0,0,0,.45);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      -webkit-tap-highlight-color:transparent;
    }

    .celebrationDismiss:active{ transform:scale(.96); }

    .celebrationClose{
      width:100%;
      min-height:48px;
      margin-top:11px;
      border:0;
      border-radius:999px;
      color:#fff;
      font-size:15px;
      font-weight:950;
      letter-spacing:.2px;
      cursor:pointer;
      background:linear-gradient(135deg, #FF2D55, #FF2FA7, #FFB347, #FF2D55);
      background-size:240% 240%;
      box-shadow:
        0 15px 42px rgba(255,45,85,.38),
        0 0 28px rgba(255,209,102,.22),
        inset 0 1px 0 rgba(255,255,255,.28);
      transition:transform .14s ease, filter .14s ease;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }

    .celebrationClose:active{ transform:scale(.985); }

    .celebrationClose.celebrating{
      animation:celebrationButtonGlow 1.35s ease-in-out infinite;
      filter:saturate(1.12) brightness(1.04);
    }

    .celebrationMusicNote{
      position:absolute;
      left:var(--nx);
      top:var(--ny);
      z-index:5;
      color:#FFE7A6;
      font-size:clamp(28px, 8.5vw, 48px);
      font-weight:950;
      text-shadow:
        0 0 10px rgba(255,255,255,.92),
        0 0 24px rgba(255,198,88,.88),
        0 0 46px rgba(255,45,135,.54);
      pointer-events:none;
      opacity:0;
      transform:translate3d(0,0,0) scale(.72) rotate(-8deg);
      animation:musicNoteFloat 3.2s ease-out forwards;
      animation-delay:var(--note-delay);
    }

    .celebrationOverlay.celebrationMinuteShow .celebrationArtwork{
      animation:celebrationArtworkShow 60s cubic-bezier(.16,.78,.18,1) forwards;
      filter:saturate(1.24) contrast(1.09) brightness(1.04);
    }

    .celebrationOverlay.celebrationMinuteShow::before{
      opacity:.66;
      animation:celebrationVortex 7.5s linear infinite;
    }

    .celebrationOverlay.celebrationMinuteShow .celebrationLightLayer::before{
      opacity:.62;
      animation-duration:4.8s;
    }

    .celebrationOverlay.celebrationMinuteShow .celebrationLightLayer::after{
      opacity:.54;
      animation-duration:3.9s;
    }

    .celebrationOverlay.celebrationEncore .celebrationLightLayer{
      animation:celebrationFlash 1.5s ease-out both;
    }

    .celebrationArtworkFallback .celebrationLightLayer{
      background:
        radial-gradient(circle at 50% 20%, rgba(255,45,85,.52), transparent 42%),
        radial-gradient(circle at 50% 55%, rgba(255,188,82,.34), transparent 58%);
    }

    @keyframes celebrationArtworkIdle{
      0%,100%{ transform:translate3d(0,0,0) scale(1.012); }
      50%{ transform:translate3d(0,-1.2%,0) scale(1.046); }
    }

    @keyframes celebrationArtworkShow{
      0%{ transform:translate3d(0,0,0) scale(1.015); }
      16%{ transform:translate3d(-1.2%,-1.8%,0) scale(1.08); }
      34%{ transform:translate3d(1.1%,-.8%,0) scale(1.12); }
      54%{ transform:translate3d(-.8%,-2.4%,0) scale(1.16); }
      76%{ transform:translate3d(1.1%,-1.3%,0) scale(1.19); }
      100%{ transform:translate3d(0,-2%,0) scale(1.13); }
    }

    @keyframes celebrationVortex{
      0%{ transform:rotate(0deg) scale(1); }
      100%{ transform:rotate(360deg) scale(1); }
    }

    @keyframes celebrationOrbit{
      0%{ transform:translate(-50%, -50%) rotate(0deg) scale(.70); }
      50%{ transform:translate(-50%, -50%) rotate(180deg) scale(.86); }
      100%{ transform:translate(-50%, -50%) rotate(360deg) scale(.70); }
    }

    @keyframes celebrationFlash{
      0%{ filter:brightness(1); opacity:1; }
      18%{ filter:brightness(1.75) saturate(1.45); opacity:1; }
      100%{ filter:brightness(1); opacity:1; }
    }

    @keyframes musicNoteFloat{
      0%{ opacity:0; transform:translate3d(0,0,0) scale(.68) rotate(-10deg); }
      14%{ opacity:1; }
      78%{ opacity:.96; }
      100%{ opacity:0; transform:translate3d(var(--ndx), var(--ndy), 0) scale(1.18) rotate(12deg); }
    }

    @keyframes celebrationButtonGlow{
      0%,100%{ background-position:0% 50%; box-shadow:0 15px 42px rgba(255,45,85,.38), 0 0 28px rgba(255,209,102,.22), inset 0 1px 0 rgba(255,255,255,.28); }
      50%{ background-position:100% 50%; box-shadow:0 18px 54px rgba(255,45,135,.50), 0 0 42px rgba(255,209,102,.32), inset 0 1px 0 rgba(255,255,255,.34); }
    }

    @media (max-width:420px){
      .celebrationCard{
        left:12px;
        right:12px;
        bottom:calc(12px + env(safe-area-inset-bottom));
        padding:12px 12px 11px;
        border-radius:23px;
      }
      .celebrationText{ font-size:12.8px; }
      .celebrationMeta{ font-size:11px; }
      .celebrationClose{ min-height:46px; }
    }

    @media (prefers-reduced-motion: reduce){
      .celebrationArtwork,
      .celebrationOverlay::before,
      .celebrationLightLayer::before,
      .celebrationLightLayer::after,
      .celebrationMusicNote,
      .celebrationClose.celebrating{
        animation:none !important;
      }
    }

    /* APP UPDATE OVERLAY */
    .updateOverlay{
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:auto;
      width:100vw;
      height:100vh;
      height:var(--app-viewport-height);
      min-height:100svh;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      background:rgba(5,6,10,.70);
      backdrop-filter:blur(20px) saturate(1.1);
      -webkit-backdrop-filter:blur(20px) saturate(1.1);
      opacity:0;
      pointer-events:none;
      transition:opacity .28s ease;
    }

    .updateOverlay.active{
      opacity:1;
      pointer-events:auto;
    }

    .updateCard{
      width:min(92vw, 410px);
      padding:24px 20px 18px;
      border-radius:30px;
      text-align:center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.065)),
        rgba(16,17,26,.82);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 30px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.18);
      transform:translateY(12px) scale(.97);
      transition:transform .32s cubic-bezier(.2,.9,.2,1);
    }

    .updateOverlay.active .updateCard{ transform:translateY(0) scale(1); }

    .updateIcon{
      width:72px;
      height:72px;
      margin:0 auto 14px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      font-weight:950;
      background:linear-gradient(145deg, rgba(255,45,85,.90), rgba(255,107,129,.46));
      border:1px solid rgba(255,255,255,.20);
      box-shadow:0 18px 48px rgba(255,45,85,.22);
      animation:updateSpin 1.6s ease-in-out infinite;
    }

    .updateEyebrow{
      display:inline-flex;
      min-height:28px;
      align-items:center;
      justify-content:center;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.74);
      font-size:11px;
      font-weight:950;
      letter-spacing:1.1px;
      text-transform:uppercase;
    }

    .updateTitle{
      margin:14px auto 8px;
      font-size:24px;
      line-height:1.1;
      font-weight:1000;
      letter-spacing:-.5px;
    }

    .updateText{
      max-width:340px;
      margin:0 auto;
      color:rgba(255,255,255,.74);
      font-size:14px;
      line-height:1.5;
      font-weight:650;
    }

    .updateVersion{
      margin:16px auto 0;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.09);
      color:rgba(255,255,255,.78);
      font-size:12px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    .updateActions{
      display:flex;
      gap:10px;
      margin-top:16px;
    }

    .updateActions button{
      flex:1;
      min-height:46px;
      border:0;
      border-radius:999px;
      font-size:14px;
      font-weight:950;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .updateLater{
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.82);
      border:1px solid rgba(255,255,255,.10) !important;
    }

    .updateNow{
      background:linear-gradient(135deg, #FF2D55, #FF6B81);
      color:white;
      box-shadow:0 16px 42px rgba(255,45,85,.24);
    }

    .updateActions button:disabled{ opacity:.72; cursor:default; }
    .updateActions button:active{ transform:scale(.985); }

    @keyframes updateSpin{
      0%,100%{ transform:rotate(0deg) scale(1); }
      50%{ transform:rotate(14deg) scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce){
      .updateOverlay,
      .updateCard,
      .updateIcon{
        animation:none !important;
        transition:none !important;
      }
    }


  </style>
</head>
