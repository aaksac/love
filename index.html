<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

  <!-- iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biz">
  <meta name="theme-color" content="#05060A">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>Biz</title>

  <style>
    :root{
      --bg0:#05060A;
      --bg1:#0A0B12;
      --app-viewport-height:100dvh;

      --card:rgba(255,255,255,.055);
      --stroke:rgba(255,255,255,.10);

      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);

      --accent:#FF2D55; /* iOS rose */
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      min-height:100%;
      background:#05060A;
      overflow-x:hidden;
    }

    html.celebration-lock,
    body.celebration-lock{
      overscroll-behavior:none;
      touch-action:none;
    }

    body{
      min-height:100vh;
      min-height:var(--app-viewport-height);
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui;
      color:var(--text);
      background:
        radial-gradient(800px 600px at 50% -10%, rgba(255,45,85,.15), transparent 60%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
    }

    .safe{
      min-height:100vh;
      min-height:var(--app-viewport-height);
      padding:calc(20px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:560px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .card{
      border-radius:26px;
      padding:18px;
      background:var(--card);
      border:1px solid var(--stroke);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:0 25px 80px rgba(0,0,0,.55);
    }

    .sectionTitle{
      font-size:12px;
      letter-spacing:1.2px;
      font-weight:900;
      color:var(--muted);
      margin-bottom:12px;
      text-align:center;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .item{
      border-radius:22px;
      padding:16px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.08);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .itemTop{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      text-align:center;
    }

    .itemName{
      font-weight:950;
      font-size:16px;
      letter-spacing:.2px;
    }

    .itemDate{
      font-size:12px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }

    .centerHeart{
      display:flex;
      justify-content:center;
      padding:12px 0 6px;
    }

    .heart{
      width:44px;
      height:44px;
      transform-origin:center;
      animation: heartbeat 1.18s infinite;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.55))
              drop-shadow(0 0 14px rgba(255,45,85,.18));
    }

    @keyframes heartbeat{
      0%   { transform: scale(1); }
      12%  { transform: scale(1.26); }
      24%  { transform: scale(1); }
      42%  { transform: scale(1.14); }
      56%  { transform: scale(1); }
      100% { transform: scale(1); }
    }

    .big{
      font-size:19px;
      font-weight:950;
      text-align:center;
      font-variant-numeric:tabular-nums;
      letter-spacing:.2px;
    }

    .pill{
      padding:9px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      font-size:12px;
      text-align:center;
      font-variant-numeric:tabular-nums;
      color:rgba(255,255,255,.78);
      line-height:1.35;
      white-space:normal;
      word-break:break-word;
    }

    /* MUSIC */
.musicControl{
  display:flex;
  justify-content:center;
  margin-bottom:4px;
}

    .musicBtn{
      padding:10px 18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.85);
      font-weight:800;
      font-size:13px;
      letter-spacing:.3px;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 10px 35px rgba(0,0,0,.55);
      cursor:pointer;
      transition:.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    .musicBtn:active{ transform:scale(.97); }

    .musicBtn.playing{
      background:rgba(255,45,85,.14);
      border-color:rgba(255,45,85,.32);
    }

    .footer{
      text-align:center;
      font-size:12px;
      color:rgba(255,255,255,.45);
      padding-top:6px;
    }
    .footer strong{color:rgba(255,255,255,.75)}


    /* ANNIVERSARY CELEBRATION OVERLAY */
    .celebrationOverlay{
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:auto;
      width:100vw;
      height:100vh;
      height:var(--app-viewport-height);
      min-height:100svh;
      z-index:9999;
      padding:calc(22px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:auto;
      background:
        radial-gradient(520px 420px at 50% 18%, rgba(255,45,85,.28), transparent 64%),
        radial-gradient(360px 320px at 18% 78%, rgba(255,184,77,.18), transparent 70%),
        radial-gradient(360px 320px at 86% 82%, rgba(255,255,255,.10), transparent 72%),
        rgba(5,6,10,.72);
      backdrop-filter:blur(22px) saturate(1.18);
      -webkit-backdrop-filter:blur(22px) saturate(1.18);
      opacity:0;
      pointer-events:none;
      transition:opacity .36s ease;
    }

    .celebrationOverlay.active{
      opacity:1;
      pointer-events:auto;
    }

    .celebrationCard{
      position:relative;
      width:min(92vw, 440px);
      padding:30px 22px 22px;
      border-radius:34px;
      text-align:center;
      color:rgba(255,255,255,.94);
      background:
        linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.07)),
        rgba(16,17,26,.72);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:
        0 34px 100px rgba(0,0,0,.62),
        inset 0 1px 0 rgba(255,255,255,.20);
      transform:translateY(14px) scale(.96);
      transition:transform .42s cubic-bezier(.2,.9,.2,1);
      overflow:hidden;
    }

    .celebrationOverlay.active .celebrationCard{
      transform:translateY(0) scale(1);
    }

    .celebrationCard::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:inherit;
      pointer-events:none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.34), transparent 28%, rgba(255,45,85,.18) 64%, rgba(255,255,255,.22));
      mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite:exclude;
      -webkit-mask-composite:xor;
      padding:1px;
      opacity:.8;
    }

    .celebrationHalo{
      position:absolute;
      width:210px;
      height:210px;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,45,85,.38), rgba(255,45,85,.10) 46%, transparent 68%);
      filter:blur(4px);
      animation:celebrationPulse 2.35s ease-in-out infinite;
    }

    .celebrationIcon{
      position:relative;
      width:94px;
      height:94px;
      margin:0 auto 16px;
      border-radius:32px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:48px;
      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.28), transparent 34%),
        linear-gradient(145deg, rgba(255,45,85,.90), rgba(255,107,129,.42));
      border:1px solid rgba(255,255,255,.22);
      box-shadow:
        0 20px 50px rgba(255,45,85,.24),
        inset 0 1px 0 rgba(255,255,255,.34);
      animation:celebrationFloat 2.8s ease-in-out infinite;
    }

    .celebrationEyebrow{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:30px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.13);
      color:rgba(255,255,255,.78);
      font-size:11px;
      font-weight:950;
      letter-spacing:1.25px;
      text-transform:uppercase;
    }

    .celebrationTitle{
      position:relative;
      margin:14px auto 8px;
      max-width:360px;
      font-size:clamp(24px, 7vw, 34px);
      line-height:1.04;
      font-weight:1000;
      letter-spacing:-.8px;
    }

    .celebrationText{
      position:relative;
      max-width:360px;
      margin:0 auto;
      color:rgba(255,255,255,.76);
      font-size:15px;
      line-height:1.55;
      font-weight:650;
    }

    .celebrationMeta{
      position:relative;
      margin:18px auto 0;
      padding:12px 14px;
      border-radius:22px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(255,255,255,.86);
      font-size:13px;
      line-height:1.45;
      font-variant-numeric:tabular-nums;
    }

    .celebrationEvents{
      position:relative;
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:14px;
    }

    .celebrationEventMini{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.09);
      color:rgba(255,255,255,.84);
      font-size:13px;
      font-weight:850;
    }

    .celebrationClose{
      position:relative;
      width:100%;
      min-height:48px;
      margin-top:18px;
      border:0;
      border-radius:999px;
      background:linear-gradient(135deg, #FF2D55, #FF6B81);
      color:white;
      font-size:15px;
      font-weight:950;
      letter-spacing:.2px;
      box-shadow:0 16px 42px rgba(255,45,85,.28);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .celebrationClose:active{ transform:scale(.985); }

    .celebrationParticle{
      position:absolute;
      left:var(--x);
      top:var(--y);
      font-size:var(--s);
      opacity:.82;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.36));
      animation:celebrationDrift var(--d) ease-in-out infinite;
      animation-delay:var(--delay);
      pointer-events:none;
      user-select:none;
    }

    @keyframes celebrationPulse{
      0%,100%{ transform:translateX(-50%) scale(.94); opacity:.72; }
      50%{ transform:translateX(-50%) scale(1.08); opacity:1; }
    }

    @keyframes celebrationFloat{
      0%,100%{ transform:translateY(0) rotate(-2deg); }
      50%{ transform:translateY(-8px) rotate(2deg); }
    }

    @keyframes celebrationDrift{
      0%,100%{ transform:translate3d(0,0,0) rotate(0deg); }
      50%{ transform:translate3d(0,-18px,0) rotate(10deg); }
    }

    @media (max-width:420px){
      .celebrationOverlay{
        padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
      }
      .celebrationCard{ padding:26px 18px 18px; border-radius:30px; }
      .celebrationIcon{ width:86px; height:86px; border-radius:30px; font-size:44px; }
      .celebrationText{ font-size:14px; }
    }

    @media (prefers-reduced-motion: reduce){
      .celebrationOverlay,
      .celebrationCard,
      .celebrationHalo,
      .celebrationIcon,
      .celebrationParticle{
        animation:none !important;
        transition:none !important;
      }
    }


    /* APP UPDATE OVERLAY */
    .updateOverlay{
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:auto;
      width:100vw;
      height:100vh;
      height:var(--app-viewport-height);
      min-height:100svh;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      background:rgba(5,6,10,.70);
      backdrop-filter:blur(20px) saturate(1.1);
      -webkit-backdrop-filter:blur(20px) saturate(1.1);
      opacity:0;
      pointer-events:none;
      transition:opacity .28s ease;
    }

    .updateOverlay.active{
      opacity:1;
      pointer-events:auto;
    }

    .updateCard{
      width:min(92vw, 410px);
      padding:24px 20px 18px;
      border-radius:30px;
      text-align:center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.065)),
        rgba(16,17,26,.82);
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 30px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.18);
      transform:translateY(12px) scale(.97);
      transition:transform .32s cubic-bezier(.2,.9,.2,1);
    }

    .updateOverlay.active .updateCard{ transform:translateY(0) scale(1); }

    .updateIcon{
      width:72px;
      height:72px;
      margin:0 auto 14px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      font-weight:950;
      background:linear-gradient(145deg, rgba(255,45,85,.90), rgba(255,107,129,.46));
      border:1px solid rgba(255,255,255,.20);
      box-shadow:0 18px 48px rgba(255,45,85,.22);
      animation:updateSpin 1.6s ease-in-out infinite;
    }

    .updateEyebrow{
      display:inline-flex;
      min-height:28px;
      align-items:center;
      justify-content:center;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.09);
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.74);
      font-size:11px;
      font-weight:950;
      letter-spacing:1.1px;
      text-transform:uppercase;
    }

    .updateTitle{
      margin:14px auto 8px;
      font-size:24px;
      line-height:1.1;
      font-weight:1000;
      letter-spacing:-.5px;
    }

    .updateText{
      max-width:340px;
      margin:0 auto;
      color:rgba(255,255,255,.74);
      font-size:14px;
      line-height:1.5;
      font-weight:650;
    }

    .updateVersion{
      margin:16px auto 0;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.09);
      color:rgba(255,255,255,.78);
      font-size:12px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    .updateActions{
      display:flex;
      gap:10px;
      margin-top:16px;
    }

    .updateActions button{
      flex:1;
      min-height:46px;
      border:0;
      border-radius:999px;
      font-size:14px;
      font-weight:950;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .updateLater{
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.82);
      border:1px solid rgba(255,255,255,.10) !important;
    }

    .updateNow{
      background:linear-gradient(135deg, #FF2D55, #FF6B81);
      color:white;
      box-shadow:0 16px 42px rgba(255,45,85,.24);
    }

    .updateActions button:disabled{ opacity:.72; cursor:default; }
    .updateActions button:active{ transform:scale(.985); }

    @keyframes updateSpin{
      0%,100%{ transform:rotate(0deg) scale(1); }
      50%{ transform:rotate(14deg) scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce){
      .updateOverlay,
      .updateCard,
      .updateIcon{
        animation:none !important;
        transition:none !important;
      }
    }


  </style>
</head>

<body>
  <div class="safe">
    <div class="wrap">

      <div class="musicControl">
        <button id="musicBtn" class="musicBtn">🎵 Müzik Başlat</button>
        <audio id="bgMusic" src="music/song.mp3" loop preload="auto"></audio>
      </div>

      <div class="card">
        <div class="sectionTitle">ÖNEMLİ TARİHLER</div>
        <div id="list" class="list"></div>
      </div>
      <div class="footer">
        Tüm hakları saklıdır. © 2026 | Designed by <strong>Ali AKSAÇ</strong>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
